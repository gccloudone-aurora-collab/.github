
name: Manage Repository Settings

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main
    paths:
      - "repo-settings/**/settings.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: manage-repository-settings
  cancel-in-progress: false

jobs:
  deploy_settings:
    runs-on: ubuntu-latest

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_REPO_MANAGER_ID }}
          private-key: ${{ secrets.ORG_REPO_MANAGER_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build config inventory
        shell: bash
        run: |
          configs="$RUNNER_TEMP/repo-configs.csv"

          echo "name,file" > "$configs"

          find repo-settings -type f -name settings.json | sort |
            while read -r file; do
              repo=$(jq -r '.name' "$file")
              echo "$repo,$file"
            done >> "$configs"

          echo "Repository inventory:"
          cat "$configs"

      - name: Build existing repository inventory
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
        run: |
          gh api --paginate \
            "orgs/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&type=all" \
            --jq '.[].name' > "$RUNNER_TEMP/existing-repos.txt"

          echo "Existing repositories:"
          cat "$RUNNER_TEMP/existing-repos.txt"

      - name: Create missing repositories
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
        shell: bash
        run: |
          tail -n +2 "$RUNNER_TEMP/repo-configs.csv" |
            while IFS=, read -r repo file; do
              if grep -Fxiq "$repo" "$RUNNER_TEMP/existing-repos.txt"; then
                echo "Repository already exists: $repo"
                continue
              fi

              echo "Creating repository: $repo"

              gh api --method POST \
                "orgs/${GITHUB_REPOSITORY_OWNER}/repos" \
                --input "$file" --silent

              echo "Repository created: $repo"
            done

      - name: Update repository settings
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
        shell: bash
        run: |
          tail -n +2 "$RUNNER_TEMP/repo-configs.csv" |
            while IFS=, read -r repo file; do
              echo "Updating repository: $repo"

              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY_OWNER}/${repo}" \
                --input "$file" --silent

              echo "Repository settings applied: $repo"
            done
